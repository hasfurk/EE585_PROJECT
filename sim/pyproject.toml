[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ee585-sim"
version = "0.1.0"
description = "MuJoCo live provider for the EE585 stream"
requires-python = ">=3.12"
dependencies = [
  "ee585-stream",
  "mujoco>=3.2",
  "numpy>=1.26",
  "pillow>=10",
  "pyyaml>=6",
  "paho-mqtt>=2.0",
  "amqtt>=0.11",
]

[tool.setuptools.packages.find]
include = ["ee585_sim*"]
